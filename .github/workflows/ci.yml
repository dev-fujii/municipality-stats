name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Vet
        if: ${{ hashFiles('**/*.go') != '' }}
        run: go vet ./...
      - name: Lint
        if: ${{ hashFiles('**/*.go') != '' }}
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: Test
        if: ${{ hashFiles('**/*.go') != '' }}
        run: go test ./...
