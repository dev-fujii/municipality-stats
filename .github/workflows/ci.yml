name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', 'stable']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Vet
        run: go vet ./...
      - name: Lint
        if: ${{ matrix.go == 'stable' }}
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: Test
        run: go test -race ./...
